name: Android 16 phone source regression
on:
  workflow_dispatch:
  push:
    branches: ['fix/plugin-ports-16kb-*']
    paths:
      - '.github/workflows/phone-source.yml'
      - 'scripts/build_api23_probes.py'
      - 'scripts/run_phone_source_probe.py'
      - 'android/tests/device/SourceHostProbe.java'
      - 'android/tests/device/HttpT4Checks.java'
      - 'android/tests/device/plugin/**'
      - 'android/src/main/java/com/pilipala/marcomovie/SourceEngine.java'
      - 'android/src/main/java/com/pilipala/marcomovie/HttpT4Engine.java'
      - 'android/src/main/java/com/pilipala/marcomovie/Cms.java'
      - 'android/src/main/java/com/pilipala/marcomovie/SourceController.java'
      - 'android/src/main/java/com/pilipala/marcomovie/QueuedSourceEngine.java'
      - 'android/src/main/java/com/pilipala/marcomovie/CspEngine.java'
      - 'android/src/main/java/com/github/catvod/crawler/Spider.java'
      - 'android/src/main/assets/js-host/**'
      - 'android/src/main/assets/python-host/**'
      - 'android/src/main/java/com/pilipala/marcomovie/JsEngine.java'
      - 'android/src/main/java/com/pilipala/marcomovie/LocalProxy.java'
      - 'android/src/main/java/com/pilipala/marcomovie/ProxyAddress.java'
      - 'android/src/main/java/com/pilipala/marcomovie/LiveCatalog.java'
      - 'shared/**'
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;28.2.13676358'
      - name: Build production phone code and isolated source fixture
        run: |
          export MARCOMOVIE_BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          python scripts/build_android.py
          python android/tests/run_api23_callback_checks.py
          python scripts/build_api23_probes.py --phone
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: python scripts/run_phone_source_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-16-phone-source-evidence
          path: |
            android/build/phone-source-probe/scope.json
            android/build/phone-source-probe/device.txt
            android/build/phone-source-probe/results.json
            android/build/phone-source-probe/*.log
            android/build/phone-source-probe/logcat.txt
          retention-days: 14
