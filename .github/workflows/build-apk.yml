name: Build MarcoMovie Phone APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358'

      - name: Build APK
        run: |
          export MARCOMOVIE_JDK="$JAVA_HOME"
          export MARCOMOVIE_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          python -X utf8 scripts/build_android.py

      - name: Keep phone APK only
        run: |
          ls -l dist/
          rm -f dist/MarcoMovie-*-android-tv.apk dist/MarcoMovie-*-preview.apk
          rm -f dist/MarcoMovie-*-android-tv.apk.sha256 dist/MarcoMovie-*-preview.apk.sha256
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: marcomovie-phone-apk
          path: dist/MarcoMovie-*-android-mobile.apk
          if-no-files-found: error