name: Android 16 mobile player regression
on:
  workflow_dispatch:
  push:
    branches: ['fix/plugin-ports-16kb-*']
    paths:
      - '.github/workflows/mobile-player.yml'
      - 'android/tests/device/MobilePlayerProbe.java'
      - 'scripts/run_mobile_player_probe.py'
      - 'scripts/build_device_probe.py'
      - 'android/src/main/java/com/pilipala/marcomovie/PlayerChrome.java'
      - 'android/src/main/java/com/pilipala/marcomovie/PlaybackController.java'
permissions:
  contents: read
jobs:
  player:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        navigation: [gestural, threebutton]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;28.2.13676358'
      - name: Build production code and isolated layout fixture
        run: |
          export MARCOMOVIE_BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          python scripts/build_android.py
          python android/tests/run_api23_callback_checks.py
          python scripts/build_device_probe.py MobilePlayerProbe
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: python scripts/run_mobile_player_probe.py --navigation ${{ matrix.navigation }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-16-player-evidence-${{ matrix.navigation }}
          path: |
            android/build/mobile-player-probe/scope.json
            android/build/mobile-player-probe/device.txt
            android/build/mobile-player-probe/navigation.txt
            android/build/mobile-player-probe/results.json
            android/build/mobile-player-probe/instrumentation.log
            android/build/mobile-player-probe/logcat.txt
            android/build/mobile-player-probe/screenshots/
          retention-days: 14
